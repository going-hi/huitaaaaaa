name: mindbase

services:
  mysql:
    image: mysql:8.0
    container_name: mindbase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindbase
    ports:
      - "3306:3306"
    volumes:
      - mindbase_mysql_data:/var/lib/mysql
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # При каждом `compose up`: применяет database/schema.sql от root через клиент MySQL (ещё до старта PHP).
  # Нужно, если том MySQL уже был без базы или у учётки приложения нет CREATE — сидер тогда только наполняет данные.
  mysql-bootstrap:
    image: mysql:8.0
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        mysql -h mysql --protocol=TCP -uroot < /schema.sql

  php:
    build: .
    container_name: mindbase-php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: mindbase
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully

volumes:
  mindbase_mysql_data:
