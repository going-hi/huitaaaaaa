name: mindbase

services:
  mysql:
    image: mysql:8.0
    container_name: mindbase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindbase
      # Учётка приложения со всеми правами только на базу mindbase (обходит ограниченный root@%).
      MYSQL_USER: mindbase
      MYSQL_PASSWORD: mindbase
    ports:
      - "3306:3306"
    volumes:
      - mindbase_mysql_data:/var/lib/mysql
      - mindbase_mysql_run:/var/run/mysqld
      - ./database/tables.sql:/docker-entrypoint-initdb.d/99-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Через сокет делает то, что нельзя ограниченному root@%: база mindbase и пользователь mindbase (совпадает с MYSQL_USER).
  mysql-bootstrap:
    image: mysql:8.0
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/bootstrap-docker.sql:/bootstrap-docker.sql:ro
      - ./database/tables.sql:/tables.sql:ro
      - mindbase_mysql_run:/var/run/mysqld
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        SOCK=/var/run/mysqld/mysqld.sock
        mysql --protocol=SOCKET --socket="$$SOCK" -uroot < /bootstrap-docker.sql
        mysql --protocol=SOCKET --socket="$$SOCK" -uroot mindbase < /tables.sql

  php:
    build: .
    container_name: mindbase-php
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: mindbase
      MYSQL_PASSWORD: mindbase
      MYSQL_DATABASE: mindbase
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully

volumes:
  mindbase_mysql_data:
  mindbase_mysql_run:
