# Скопировать на сервер:
#   sudo cp docker/nginx/mindbase-innim.ru.conf /etc/nginx/sites-available/mindbase-innim.ru
#   sudo ln -sf /etc/nginx/sites-available/mindbase-innim.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker должен слушать только localhost:8081 (см. docker-compose.yml).
# Затем: sudo certbot --nginx -d mindbase-innim.ru --register-unsafely-without-email --agree-tos

server {
    listen 80;
    listen [::]:80;
    server_name mindbase-innim.ru;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
