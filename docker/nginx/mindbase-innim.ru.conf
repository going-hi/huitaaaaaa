# После certbot в /etc/nginx/sites-available/mindbase-innim.ru добавьте location /phpmyadmin/
# и в docker-compose.yml: PMA_ABSOLUTE_URI: https://mindbase-innim.ru/phpmyadmin/
# Затем: docker compose up -d phpmyadmin && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mindbase-innim.ru;

    ssl_certificate /etc/letsencrypt/live/mindbase-innim.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbase-innim.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /phpmyadmin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /phpmyadmin {
        return 301 https://$host/phpmyadmin/;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mindbase-innim.ru;

    if ($host = mindbase-innim.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
